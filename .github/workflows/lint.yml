name: Lint

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -noEmit -skipLibCheck

      # Obsidian's official plugin-guideline rules. Fails on any warning.
      - name: ESLint (obsidianmd)
        run: npx eslint . --max-warnings=0
